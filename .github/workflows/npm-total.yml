name: Cumulative npm downloads

on:
  schedule:
    - cron: '41 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cumulative-npm-downloads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node --test test/npm-total-downloads.node.mjs
      - run: node scripts/npm-total-downloads.mjs
      - run: node scripts/npm-total-downloads.mjs --check
      - name: Save changed public totals
        env:
          GIT_AUTHOR_NAME: lijiaqimun-coder
          GIT_AUTHOR_EMAIL: lijiaqi.mun@gmail.com
          GIT_COMMITTER_NAME: lijiaqimun-coder
          GIT_COMMITTER_EMAIL: lijiaqi.mun@gmail.com
        shell: bash
        run: |
          git add -- assets/statistics/npm-total-*.svg docs/measurements/npm-total.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh cumulative npm download requests"
          git push origin HEAD:main

