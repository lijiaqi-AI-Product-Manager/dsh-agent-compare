name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 26
      - run: npm run test:coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 26
      - run: npm pack --dry-run

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - run: npm ci
      - run: npx playwright-core install --with-deps --only-shell chromium
        if: runner.os == 'Linux'
      - run: npx playwright-core install --only-shell chromium
        if: runner.os == 'Windows'
      - run: npm run smoke
      - run: npm run test:ui

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm ci --prefix examples/vite-react-demo --ignore-scripts
      - run: npm audit --prefix examples/vite-react-demo --audit-level=moderate
