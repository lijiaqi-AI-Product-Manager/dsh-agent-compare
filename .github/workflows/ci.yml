name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
        include:
          - os: macos-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:test-projects
        if: matrix.os == 'ubuntu-latest' && matrix.node == 26
      - run: npm test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 26
      - run: npm run test:coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 26
      - run: npm pack --dry-run
      - run: npm run check:docs
        if: matrix.os == 'ubuntu-latest' && matrix.node == 26
      - run: npm run check:distribution
        if: matrix.node == 26
      - run: npm run check:prebuilt
        if: matrix.node == 26

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - run: npm ci
      - name: Configure bounded Ubuntu browser downloads
        if: runner.os == 'Linux'
        run: sudo -n env GITHUB_ACTIONS=true "$(command -v node)" scripts/prepare-linux-browser-deps.mjs
      - run: npx playwright-core install --with-deps --only-shell chromium
        if: runner.os == 'Linux'
      - run: npx playwright-core install --only-shell chromium
        if: runner.os != 'Linux'
      - run: npm run smoke
      - name: Check record compatibility with the published release
        if: runner.os == 'Linux'
        run: node scripts/check-record-compatibility.mjs
      - run: npm run test:ui
      - name: Verify UI in Microsoft Edge
        if: runner.os == 'Windows'
        run: npm run test:ui
        env:
          AGENT_COMPARE_UI_BROWSER_CHANNEL: msedge

  browser-ui:
    name: browser UI (${{ matrix.os }}, ${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        engine: [firefox, webkit]
    env:
      AGENT_COMPARE_UI_BROWSER_ENGINE: ${{ matrix.engine }}
      AGENT_COMPARE_UI_ARTIFACTS: .runtime-checks/browser-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - run: npm ci
      - name: Configure bounded Ubuntu browser downloads
        if: runner.os == 'Linux'
        run: sudo -n env GITHUB_ACTIONS=true "$(command -v node)" scripts/prepare-linux-browser-deps.mjs
      - run: npx playwright-core install --with-deps ${{ matrix.engine }}
        timeout-minutes: 8
        if: runner.os == 'Linux'
      - run: npx playwright-core install ${{ matrix.engine }}
        timeout-minutes: 8
        if: runner.os != 'Linux'
      - name: Exercise browser-specific origins and interface behavior
        timeout-minutes: 8
        run: npm run build && node scripts/test-browser-platform.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.os }}-${{ matrix.engine }}
          path: .runtime-checks/browser-evidence
          include-hidden-files: true
          retention-days: 7

  safari:
    name: native Safari (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26-intel]
    timeout-minutes: 30
    env:
      AGENT_COMPARE_UI_ARTIFACTS: .runtime-checks/safari-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - run: npm ci
      - run: npm run build
      - run: node scripts/prepare-current-safari.mjs
        timeout-minutes: 15
      - run: sudo /usr/bin/safaridriver --enable
      - run: node scripts/with-preview-network.mjs safari
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-safari-${{ matrix.os }}
          path: .runtime-checks/safari-evidence
          include-hidden-files: true
          retention-days: 7

  host-runtime:
    name: host runtime (${{ matrix.os }}, DSH ${{ matrix.dsh }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dsh: [0.2.1-rc.5, 0.2.2-rc.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - run: npm ci
      - run: npm install --prefix .runtime-checks/host-sdk --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }}
      - run: npm run test:runtime
        if: runner.os != 'macOS'
      - run: npm run build && node scripts/with-preview-network.mjs runtime
        if: runner.os == 'macOS'

  host-next:
    name: next host canary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - run: npm ci
      - run: npm install --prefix .runtime-checks/host-sdk --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@next
      - run: npm run test:runtime
        if: runner.os != 'macOS'
      - run: npm run build && node scripts/with-preview-network.mjs runtime
        if: runner.os == 'macOS'

  package-managers:
    name: package manager runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      YARN_ENABLE_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - run: npm ci
      - run: npm install --prefix .runtime-checks/host-sdk --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1
      - name: Configure bounded Ubuntu browser downloads
        if: runner.os == 'Linux'
        run: sudo -n env GITHUB_ACTIONS=true "$(command -v node)" scripts/prepare-linux-browser-deps.mjs
      - run: npx playwright-core install --with-deps --only-shell chromium
        if: runner.os == 'Linux'
      - run: npx playwright-core install --only-shell chromium
        if: runner.os != 'Linux'
      - run: npm run test:managers

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm ci --prefix examples/vite-react-demo --ignore-scripts
      - run: npm audit --prefix examples/vite-react-demo --audit-level=moderate
